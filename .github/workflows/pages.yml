# GitHub Pages 배포.
#
# 왜 별도 워크플로우인가:
# Pages 소스 설정에는 두 가지 모드가 있다.
#   (A) "Deploy from a branch" — main / docs 를 지정하면 GitHub가 알아서 서빙한다.
#       이 워크플로우 없이 동작한다.
#   (B) "GitHub Actions" — 배포를 워크플로우가 담당한다. 최신 기본값이며,
#       이 파일이 없으면 아무것도 배포되지 않는다.
#
# 어느 모드인지 저장소 설정을 읽을 방법이 없으므로 (B)를 지원하는 워크플로우를
# 둔다. (A)로 설정되어 있으면 이 워크플로우는 "Pages site not configured for
# Actions" 로 실패하는데, 그 실패 자체가 어느 모드인지 알려주는 진단이 된다.
#
# 공개 페이지는 이 프로젝트의 검증 장치다. 아웃바운드로 프리랜서에게 물어볼 수
# 없는 상황이라, 공개해 두고 액세스 요청(GitHub Issue) 수로 수요를 측정한다.
# 따라서 배포가 조용히 실패하면 검증 자체가 시작되지 않는다.

name: Deploy Pages

on:
  push:
    branches: [main]
    # 일일 스캔이 docs/index.html 을 갱신할 때마다 재배포된다.
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 순차적으로. 진행 중인 배포를 취소하지 않는다 —
# 중간 상태로 사이트가 남는 것을 피한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      # enablement: true 가 핵심이다.
      #
      # 실측: GET /repos/xiangbaej/hiresignal/pages 가 404를 반환했다. 공개
      # 저장소에서 이 응답은 "Pages가 아예 활성화되지 않았다"는 뜻이다. 설정
      # 화면을 사람이 눌러야 하는 상태였다.
      #
      # 이 옵션은 pages:write 권한으로 Pages를 직접 활성화하고 소스를 workflow로
      # 지정한다. 즉 사람이 설정을 만지지 않아도 배포가 시작된다. 검증 장치가
      # 사람의 클릭 한 번에 막혀 있는 상태를 없애는 것이 목적이다.
      # continue-on-error 로 둔 이유:
      #
      # 이 스텝은 두 가지 이유로 실패할 수 있고, 둘 중 하나는 정상 상태다.
      #   (1) Pages 소스가 "Deploy from a branch"(main /docs)로 설정된 경우
      #       → Pages는 이미 정상 동작하고 이 워크플로우는 불필요하다. 실패가 맞다.
      #   (2) GITHUB_TOKEN 이 읽기 전용인 경우 → 실제 문제다.
      #
      # 저장소 설정을 워크플로우에서 읽을 방법이 없어 (1)과 (2)를 구분할 수 없다.
      # (1)일 때 빨간 X가 매일 뜨면 진짜 문제를 놓치게 되므로, 실패를 삼키고
      # 마지막 스텝에서 어떤 상태인지 안내한다.
      - name: Pages 설정 (필요 시 활성화)
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 산출물 업로드
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          # docs/ 만 배포한다. data/ 의 내부용 전체 리포트는 공개하지 않는다.
          path: docs

      - name: 배포
        id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: 상태 안내
        run: |
          if [ "${{ steps.configure.outcome }}" = "success" ]; then
            echo "Pages 배포 완료: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "::warning::Pages 를 Actions 로 배포하지 못했습니다."
            echo ""
            echo "다음 중 하나입니다."
            echo "  (A) Settings > Pages > Source 가 'Deploy from a branch'(main /docs) 로"
            echo "      설정되어 있다면 정상입니다. Pages 가 이미 docs/ 를 서빙하고 있으며"
            echo "      이 워크플로우는 필요하지 않습니다."
            echo "  (B) Settings > Actions > General > Workflow permissions 가 읽기 전용이면"
            echo "      토큰이 Pages 를 활성화할 수 없습니다. 'Read and write permissions' 로"
            echo "      변경하세요. 이 설정은 일일 스캔의 스냅샷 커밋에도 필요합니다."
            echo ""
            echo "확인: https://xiangbaej.github.io/hiresignal/ 가 열리면 (A) 입니다."
          fi
