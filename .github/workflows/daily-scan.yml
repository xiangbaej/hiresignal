# 일일 ATS 스캔.
#
# 왜 GitHub Actions인가:
# 이 제품의 핵심 신호(관측 나이·재게시·충원)는 끊기지 않는 일일 스냅샷에서만
# 나온다. 로컬 노트북 스케줄러에 의존하면 전원이 꺼진 날 신호에 구멍이 생기고,
# 그 구멍은 사후에 메울 수 없다. 관측은 되돌릴 수 없는 자산이다.
#
# 상태 영속화 전략:
# 스캔 결과(data/)를 리포지토리에 커밋해서 다음 실행이 이어받는다. 규모가
# 커지면(수십만 공고) Postgres로 옮겨야 하지만, 초기에는 이 방식이 인프라 비용
# 0원이면서 감사 이력이 git 히스토리로 남는 장점이 있다.
#
# Pages 배포:
# 별도 워크플로우가 필요하지 않다. Pages 소스가 "Deploy from a branch"(main /docs)
# 이므로 GitHub 내장 빌더가 docs/ 변경을 감지해 배포한다.
#
# 주의할 만한 점: 보통 GITHUB_TOKEN 으로 만든 푸시는 다른 워크플로우를 트리거하지
# 않는다(재귀 방지). 그런데 내장 Pages 빌더는 워크플로우가 아니라 GitHub App 이라
# 이 제약을 받지 않는다. 실측 확인: 봇 커밋 d9e9ec9 가 pages build and deployment
# 를 트리거해 success 로 완료했다. 따라서 아래 커밋 스텝이 docs/ 를 갱신하면
# 사이트도 자동으로 갱신된다.

name: Daily ATS Scan

on:
  schedule:
    # 매일 03:10 UTC (KST 12:10). 정시를 피해 러너 혼잡을 줄인다.
    - cron: '10 3 * * *'
  workflow_dispatch: # 수동 실행 허용

# 동시 실행 방지. 파일 저장소는 단일 프로세스를 전제한다.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # 스냅샷 커밋에만 쓰는 최소 권한
      contents: write

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      # 보강을 스캔보다 먼저 돌린다.
      #
      # 이유: 리드 산출은 스캔 단계에서 일어나므로, 아카이브 캐시가 그 전에
      # 갱신되어 있어야 그날 리드에 반영된다. 순서를 바꾸면 아카이브 증거가
      # 항상 하루 늦게 반영된다. 전날 스냅샷 기준으로 보강하므로 당일 신규
      # 공고는 다음 실행에서 증거를 얻는데, 그 정도 지연은 허용된다.
      #
      # archive.org 응답이 건당 1초 이상이라 한 번에 전량 처리할 수 없다.
      # 스크립트가 12분 예산에서 자발적으로 멈추고 캐시를 저장하므로 며칠에
      # 걸쳐 백필이 완성된다.
      #
      # continue-on-error: 보강은 부가 신호다. archive.org 장애로 실패해도
      # 스냅샷 커밋은 반드시 진행되어야 한다 — 관측 이력이 더 중요한 자산이고,
      # 하루 놓치면 사후에 메울 수 없다.
      - name: Wayback 아카이브 보강
        continue-on-error: true
        run: npx tsx src/pipeline/enrich-archive.ts --limit 600

      - name: 스캔 실행 및 리드 산출
        env:
          SCAN_CONCURRENCY: '4' # 러너에서는 보수적으로
          SCAN_TIMEOUT_MS: '30000'
        run: npx tsx src/pipeline/scan.ts --report --export

      # 두 개의 산출물을 만든다.
      #   data/report.html  내부용 전체 목록
      #   docs/index.html   공개용 티저 (GitHub Pages)
      #
      # 공개 페이지가 검증 장치다. 아웃바운드로 프리랜서에게 물어볼 수 없는 상황이라
      # 공개해 두고 액세스 요청(GitHub Issue) 수로 수요를 측정한다.
      - name: HTML 리포트 생성
        run: npx tsx src/pipeline/report-html.ts

      # 생성된 리포트를 실제 DOM 에 올려 동작을 확인한다.
      #
      # 왜 생성 직후인가: 리포트는 커밋되는 동시에 docs/ 를 통해 배포된다. 상호작용이
      # 깨진 산출물이 커밋되면 그대로 공개되고, 다음 실행이 그 위에 쌓인다. 여기서
      # 멈추면 직전 정상 산출물이 그대로 남는다.
      #
      # 정적 검사로는 부족하다는 것이 실측으로 확인됐다. `.feed{display:flex}` 가
      # [hidden] 을 덮어 두 피드가 동시에 렌더된 것과, 보기 전환이 Hot·미연락 필터를
      # 꺼뜨린 것 모두 "클릭하고 결과를 본다"로만 잡혔다.
      - name: 리포트 UI 행동 테스트
        run: npx tsx src/scripts/test-report-ui.ts

      # 커밋 직전에 원장이 줄어들지 않았는지 확인한다.
      #
      # 2026-07-31 에 봇이 커밋한 관측 5,558줄이 스테일한 작업트리 커밋으로
      # 사라진 사고가 있었다(d9e9ec9 → 9f95905). 앱 코드에는 원장을 줄일 경로가
      # 없으므로 손실은 항상 git 경로에서 오고, 따라서 검사도 커밋 직전에 둔다.
      #
      # 실패 시 커밋을 진행하지 않는다. 잘못된 상태를 푸시하면 다음 실행이 그걸
      # 이어받아 손실이 확정된다 — 여기서 멈추는 편이 복구가 쉽다.
      - name: 원장 회귀 검사
        run: npx tsx src/scripts/check-ledger.ts

      - name: 스냅샷 커밋
        run: |
          git config user.name  "hiresignal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          # 변경이 없으면 커밋을 만들지 않는다 (빈 커밋으로 히스토리 오염 방지)
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(scan): 일일 스냅샷 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-failure-logs
          path: data/runs.jsonl
          if-no-files-found: ignore
          retention-days: 14
